"bg-surface text-on-surface font-body-md text-body-md min-h-screen antialiased"><main class="w-full min-h-screen bg-surface flex flex-col justify-between"><div class="flex flex-col w-full">
<div class="relative w-full min-h-screen flex items-center justify-center p-gutter md:p-space-xl overflow-hidden">
<!-- Subtle Ambient Topographic & Atmospheric Gradient Elements -->


<!-- Central Dedicated Authentication Card Container -->
<div class="relative w-full max-w-md mx-auto z-10">
<!-- Top Telemetry Status Pill -->

<!-- Main Login Surface Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-xl p-space-xl transition-all duration-300">
<!-- Brand Header Section -->
<div class="flex flex-col items-center text-center"><div class="w-44 max-h-20 flex items-center justify-center mb-space-md mx-auto"><img alt="Kelani Valley Plantations Logo" class="w-auto max-h-20 object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEQP1KH89IQKeJdZWGbdF1zYi1AnwqbJoyObbFD3QlzUoWSbBZkWIDNnQs8VCUnXH_yStrAGmmDsaIeU7SZ18IW_MjY5vZGdpSVnnB2ZEN9q52bGk6C9IGEJOVYy4Ur4rt2mdjAmX67eAC1rThGmvaAw37deECUMv7D8ATQIT1-GIuWUCeDxD_QpCZMNor5Dox3lIjCmDgKbE-GQ8LPiHukZgMDIvRdmWsCuZh4olrIH3wx2z3x55CTA"></div><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50/80 border border-blue-200/60 mb-space-xs text-[#0a369d] font-label-md text-label-md font-semibold tracking-wide uppercase"><span class="w-2 h-2 rounded-full bg-[#116c4a]"></span>Tea Withering Monitoring System</div><h1 class="font-headline-lg text-headline-lg text-primary tracking-tight font-semibold">Welcome Back</h1><p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs max-w-xs">Sign in to monitor trough batch operations and estate telemetry.</p></div>
<!-- Credentials Form -->
<form class="mt-space-lg space-y-space-md" onsubmit="event.preventDefault(); handleAuthSubmit();">
<!-- Email Address Input Field -->
<div class="flex flex-col space-y-space-xs text-left">
<label class="font-label-lg text-label-lg text-on-surface font-medium flex items-center justify-between" for="estate-email"><span>Email Address</span></label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-on-surface-variant text-lg pointer-events-none select-none">
                alternate_email
              </span>
<input autocomplete="email" class="w-full pl-11 pr-space-md py-2.5 rounded-lg bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-[#0284c7]/40 focus:border-[#0284c7]" id="estate-email" name="email" placeholder="manager@kelanivalley.com" required="" type="email">
</div>
</div>
<!-- Password Input Field with Interactive Show/Hide Toggle -->
<div class="flex flex-col space-y-space-xs text-left">
<label class="font-label-lg text-label-lg text-on-surface font-medium" for="estate-password">
              Password
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-on-surface-variant text-lg pointer-events-none select-none">
                lock
              </span>
<input autocomplete="current-password" class="w-full pl-11 pr-11 py-2.5 rounded-lg bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-[#0284c7]/40 focus:border-[#0284c7]" id="estate-password" name="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-space-md text-on-surface-variant hover:text-primary transition-colors focus:outline-none flex items-center justify-center p-1" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-lg" id="toggle-icon">
                  visibility
                </span>
</button>
</div>
</div>
<!-- Controls: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input class="w-4 h-4 rounded bg-surface-container-high text-primary-container accent-primary-container cursor-pointer focus:ring-0" id="remember-me" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant select-none">Remember Me</span>
</label>
<a class="font-label-md text-label-md text-[#0a369d] hover:text-[#0284c7] transition-colors font-semibold" href="#forgot-password">Forgot Password?</a>
</div>
<!-- Primary Submit Action -->
<div class="pt-space-xs">
<button class="w-full min-h-[44px] flex items-center justify-center gap-space-sm rounded-lg bg-gradient-to-r from-[#0a369d] via-[#1e3a8a] to-[#0a369d] hover:from-[#1e40af] hover:to-[#1d4ed8] text-on-primary font-label-lg text-label-lg tracking-wide shadow-md hover:shadow-lg active:scale-[0.99] transition-all duration-200 cursor-pointer" id="login-btn" type="submit">
<span>Login to Console</span>
<span class="material-symbols-outlined text-lg">
                arrow_forward
              </span>
</button>
</div>
</form>
<!-- Technical Verification Footer inside Card -->

</div>
<!-- Institutional Footer Note -->

</div>
</div>
<!-- Interactive Client-side Script for Field Logic -->
<script>
    (function initAuthInteractions() {
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('estate-password');
      const toggleIcon = document.getElementById('toggle-icon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    })();

    function handleAuthSubmit() {
      const btn = document.getElementById('login-btn');
      if (btn) {
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<span class="inline-block w-4 h-4 rounded-full border-2 border-on-primary border-t-transparent animate-spin mr-2"></span> Authenticating...';
        btn.classList.add('opacity-90', 'pointer-events-none');
        
        setTimeout(() => {
          btn.innerHTML = originalContent;
          btn.classList.remove('opacity-90', 'pointer-events-none');
        }, 1500);
      }
    }
  </script>
</div></main>
